<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090A0D" id="theme-color-meta" />
    <meta
      name="description"
      content="Portfolio of Mrh Rafi, a Flutter App Developer from Bangladesh building thoughtful, user-focused mobile applications with clean UI and strong algorithmic foundations in C++ and DSA."
    />
    <meta property="og:title" content="Mrh Rafi — Flutter App Developer" />
    <meta
      property="og:description"
      content="Thoughtful, user-focused mobile experiences built with Flutter and Dart. Explore real projects including Clocky and Expify Beta."
    />
    <meta property="og:type" content="website" />
    <title>Mrh Rafi — Flutter App Developer</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('mrh-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'light' ? '#F8F9FA' : '#090A0D'
            );
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
